name: Zenith Guard CI/CD Build & Sign APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Auto-Increment Version & Verify Signed APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --------------------------------------------------
      # 3. Android SDK
      # GitHub ubuntu-latest already contains Android SDK.
      # We only make sure the required components exist.
      # --------------------------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager bulunamadı!"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparation complete."

      # --------------------------------------------------
      # 4. Install Gradle
      # --------------------------------------------------
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # --------------------------------------------------
      # 5. Recreate Gradle Wrapper
      # Existing broken gradlew is ignored.
      # --------------------------------------------------
      - name: Recreate Gradle Wrapper
        shell: bash
        run: |
          rm -f gradlew
          rm -f gradlew.bat

          echo "Creating fresh Gradle Wrapper..."

          gradle wrapper

          chmod +x gradlew

          echo "Testing Gradle Wrapper..."

          ./gradlew --version

      # --------------------------------------------------
      # 6. Prepare Keystore
      # --------------------------------------------------
      - name: Prepare Keystore & Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p app/keystore

          if [ -n "$KEYSTORE_BASE64" ]; then

            echo "Custom keystore detected."
            echo "Decoding keystore..."

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > app/keystore/zenithguard.jks

          else

            echo "No custom keystore detected."
            echo "Generating temporary release keystore..."

            STORE_PASS="${KEYSTORE_PASSWORD:-ZenithGuard123!}"
            KEY_PASS="${KEY_PASSWORD:-ZenithGuard123!}"

            keytool -genkeypair \
              -v \
              -keystore app/keystore/zenithguard.jks \
              -alias zenithguard_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"

          fi

          echo "Keystore preparation complete."

      # --------------------------------------------------
      # 7. Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zenithguard_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}

        shell: bash
        run: |
          echo "========================================"
          echo "Building Zenith Guard Release APK"
          echo "Version Code: $BUILD_NUMBER"
          echo "Version Name: $RELEASE_VERSION_NAME"
          echo "========================================"

          ./gradlew clean assembleRelease \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="$RELEASE_VERSION_NAME" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace \
            --no-daemon

      # --------------------------------------------------
      # 8. Locate APK
      # --------------------------------------------------
      - name: Locate Release APK
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory does not exist!"
            exit 1
          fi

          GENERATED_APK=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$GENERATED_APK" ]; then
            echo "ERROR: No APK was generated!"

            echo "Release directory contents:"
            find "$APK_DIR" -type f -print || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$GENERATED_APK"

          echo "GENERATED_APK=$GENERATED_APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Verify APK Signature
      # --------------------------------------------------
      - name: Verify APK Signature
        shell: bash
        run: |
          echo "Verifying APK signature..."

          BUILD_TOOLS_DIR=$(ls -d \
            "$ANDROID_HOME"/build-tools/* \
            | sort -V \
            | tail -n 1)

          if [ ! -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$GENERATED_APK"

          echo "========================================"
          echo "APK SIGNATURE VERIFICATION SUCCESSFUL"
          echo "========================================"

      # --------------------------------------------------
      # 10. Organize APK
      # --------------------------------------------------
      - name: Organize APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          mkdir -p output

          OUTPUT_APK="output/ZenithGuard-v1.0.${BUILD_NUMBER}-Signed.apk"

          cp "$GENERATED_APK" "$OUTPUT_APK"

          echo "Final APK:"
          ls -lh "$OUTPUT_APK"

      # --------------------------------------------------
      # 11. Upload Artifact
      # --------------------------------------------------
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithGuard-v1.0.${{ github.run_number }}-Signed-APK
          path: output/ZenithGuard-v1.0.${{ github.run_number }}-Signed.apk
          if-no-files-found: error
          retention-days: 30

