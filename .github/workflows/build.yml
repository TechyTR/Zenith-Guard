
​name: Zenith Guard CI/CD Build APK
​on:
push:
branches: [ "main", "master" ]
tags:
- 'v*'
pull_request:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build:
name: Build & Sign Zenith Guard APK
runs-on: ubuntu-latest
​steps:
# STREAMING_CHUNK:Checking out source code repository...
- name: Checkout Repository
uses: actions/checkout@v4
​# STREAMING_CHUNK:Setting up Java 17 Development Kit...
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
cache: 'gradle'
​# STREAMING_CHUNK:Granting execution permissions to Gradle wrapper...
- name: Grant Execute Permission for Gradle Wrapper
run: chmod +x gradlew
​# STREAMING_CHUNK:Decoding keystore or generating fallback keystore...
- name: Decode Keystore or Generate CI Keystore
env:
KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
run: |
mkdir -p app/keystore
if [ -n "$KEYSTORE_BASE64" ]; then
echo "Decoding Keystore from GitHub Repository Secrets..."
echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/zenithguard.jks
else
echo "Generating fallback Keystore for CI environment..."
keytool -genkey -v -keystore app/keystore/zenithguard.jks 
-alias zenithguard_key -keyalg RSA -keysize 2048 -validity 10000 
-storepass "ZenithGuard123!" -keypass "ZenithGuard123!" 
-dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"
fi
​# STREAMING_CHUNK:Compiling signed Release APK using Gradle...
- name: Build Release APK
env:
KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}
KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zenithguard_key' }}
KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}
run: ./gradlew assembleRelease --stacktrace
​# STREAMING_CHUNK:Organizing output binaries for release artifact...
- name: Rename & Organize Generated APK
run: |
mkdir -p output/
find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/ZenithGuard-Release.apk ;
​# STREAMING_CHUNK:Uploading compiled APK artifact to GitHub...
- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: ZenithGuard-Release-APK
path: output/ZenithGuard-Release.apk
retention-days: 30
​# STREAMING_CHUNK:Publishing GitHub Release upon version tag push...
- name: Create GitHub Release
if: startsWith(github.ref, 'refs/tags/')
uses: softprops/action-gh-release@v2
with:
files: output/ZenithGuard-Release.apk
draft: false
prerelease: false
generate_release_notes: true
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
