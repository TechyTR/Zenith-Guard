name: Zenith Guard CI/CD Build & Sign APK
​on:
push:
branches: [ "" ]
pull_request:
branches: [ "" ]
workflow_dispatch:
​permissions:
contents: write
​jobs:
build:
name: Build, Auto-Increment Version & Verify Signed APK
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
cache: 'gradle'
​- name: Grant Execute Permission for Gradle Wrapper
run: chmod +x gradlew
​- name: Prepare Keystore & Credentials
env:
KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
run: |
mkdir -p app/keystore
if [ -n "KEYSTORE_BASE64" ]; then
echo "Decoding custom user keystore from Secrets..."
echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/zenithguard.jks
else
echo "Generating automated release keystore in CI runner..."
keytool -genkey -v -keystore app/keystore/zenithguard.jks \
-alias zenithguard_key -keyalg RSA -keysize 2048 -validity 10000 \
-storepass "${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}" \
-keypass "{{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}" 
-dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"
fi
​- name: Build Signed Release APK with Dynamic Versioning
env:
BUILD_NUMBER: {{ github.run_number }}
RELEASE_VERSION_NAME: "1.0.{{ github.run_number }}"
KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}
KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zenithguard_key' }}
KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}
run: ./gradlew assembleRelease --stacktrace
​- name: Verify APK Signature (Apksigner Check)
run: |
BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* \vert{} tail -n 1)$BUILD_TOOLS_DIR/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk || true
echo "APK İmzalama Doğrulaması Tamamlandı!"
​- name: Organize Output Artifacts
run: |
mkdir -p output/
cp app/build/outputs/apk/release/app-release.apk output/ZenithGuard-v1.0.${{ github.run_number }}-Signed.apk
​- name: Upload Signed APK Artifact
uses: actions/upload-artifact@v4
with:
name: ZenithGuard-v1.0.{{ github.run_number }}-Signed-APK
path: output/ZenithGuard-v1.0.{{ github.run_number }}-Signed.apk
retention-days: 30
