name: Zenith Guard CI/CD Build & Sign APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Verify APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 5. Make sure Gradle Wrapper exists
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew bulunamadı."
            echo "Gradle Wrapper oluşturuluyor..."
            gradle wrapper
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

      # 6. Prepare signing keystore
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Custom keystore bulundu."

            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/zenithguard.jks

          else
            echo "Custom keystore bulunamadı."
            echo "CI için geçici release keystore oluşturuluyor."

            STORE_PASS="${KEYSTORE_PASSWORD:-ZenithGuard123!}"
            KEY_PASS="${KEY_PASSWORD:-ZenithGuard123!}"

            keytool -genkeypair \
              -v \
              -keystore app/keystore/zenithguard.jks \
              -alias zenithguard_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"
          fi

          echo "Keystore hazır."

      # 7. Build variables
      - name: Set Build Variables
        shell: bash
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

          echo "Version Code: ${{ github.run_number }}"
          echo "Version Name: 1.0.${{ github.run_number }}"

      # 8. Build Release APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-ZenithGuard123!}"
          KEY_PASS="${KEY_PASSWORD:-ZenithGuard123!}"
          ALIAS="${KEY_ALIAS:-zenithguard_key}"

          ./gradlew clean assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PKEYSTORE_PASSWORD="$STORE_PASS" \
            -PKEY_PASSWORD="$KEY_PASS" \
            -PKEY_ALIAS="$ALIAS" \
            --stacktrace \
            --no-daemon

      # 9. Locate APK
      - name: Locate APK
        shell: bash
        run: |
          echo "Release APK dosyaları:"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "HATA: Release APK oluşturulamadı!"
            exit 1
          fi

          echo "APK bulundu: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # 10. Verify signature
      - name: Verify APK Signature
        shell: bash
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          echo "Android Build Tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature doğrulaması başarılı."

      # 11. Organize APK
      - name: Organize APK
        shell: bash
        run: |
          mkdir -p output

          OUTPUT_APK="output/ZenithGuard-v${VERSION_NAME}-Signed.apk"

          cp "$APK_PATH" "$OUTPUT_APK"

          echo "OUTPUT_APK=$OUTPUT_APK" >> "$GITHUB_ENV"

          ls -lh output/

      # 12. Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenithGuard-v${{ github.run_number }}-Signed-APK
          path: output/ZenithGuard-v${{ github.run_number }}-Signed.apk
          if-no-files-found: error
          retention-days: 30

