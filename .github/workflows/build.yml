name: Zenith Guard CI/CD Build & Sign APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Auto-Increment Version & Verify Signed APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

         - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recreate Gradle Wrapper
        run: |
          rm -f gradlew
          rm -f gradlew.bat

          gradle wrapper

          chmod +x gradlew

          echo "Generated Gradle Wrapper:"
          head -n 10 gradlew

          echo "Testing Gradle Wrapper:"
          ./gradlew --version


      - name: Prepare Keystore & Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom user keystore..."

            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/zenithguard.jks

          else
            echo "Generating release keystore..."

            STORE_PASS="${KEYSTORE_PASSWORD:-ZenithGuard123!}"
            KEY_PASS="${KEY_PASSWORD:-ZenithGuard123!}"

            keytool -genkeypair \
              -v \
              -keystore app/keystore/zenithguard.jks \
              -alias zenithguard_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"
          fi

      - name: Build Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zenithguard_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="$RELEASE_VERSION_NAME" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace

      - name: Locate & Verify Signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "HATA: APK release klasörü bulunamadı!"
            exit 1
          fi

          GENERATED_APK=$(find "$APK_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$GENERATED_APK" ]; then
            echo "HATA: Derleme sonrası hiçbir APK dosyası bulunamadı!"

            echo "APK klasörünün içeriği:"
            find "$APK_DIR" -type f -print || true

            exit 1
          fi

          echo "Bulunan APK: $GENERATED_APK"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          echo "APK imzası doğrulanıyor..."

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$GENERATED_APK"

          echo "APK Signature Verification Complete!"

          mkdir -p output

          OUTPUT_APK="output/ZenithGuard-v1.0.${BUILD_NUMBER}-Signed.apk"

          cp "$GENERATED_APK" "$OUTPUT_APK"

          echo "Final APK:"
          ls -lh "$OUTPUT_APK"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithGuard-v1.0.${{ github.run_number }}-Signed-APK
          path: output/ZenithGuard-v1.0.${{ github.run_number }}-Signed.apk
          if-no-files-found: error
          retention-days: 30

