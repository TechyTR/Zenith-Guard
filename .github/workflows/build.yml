name: Zenith Guard CI/CD Build & Sign APK
​on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:
​permissions:
contents: write
​jobs:
build:
name: Build, Auto-Increment Version & Verify Signed APK
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
cache: gradle
​- name: Grant Execute Permission for Gradle Wrapper
run: chmod +x gradlew
​- name: Prepare Keystore & Credentials
env:
KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
run: |
mkdir -p app/keystore
​if [ -n "$KEYSTORE_BASE64" ]; then
echo "Decoding custom user keystore..."
echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/zenithguard.jks
else
echo "Generating release keystore..."
​STORE_PASS="{KEYSTORE_PASSWORD:-ZenithGuard123!}"
KEY_PASS="{KEY_PASSWORD:-ZenithGuard123!}"
​keytool -genkeypair 
-v 
-keystore app/keystore/zenithguard.jks 
-alias zenithguard_key 
-keyalg RSA 
-keysize 2048 
-validity 10000 
-storepass "$STORE_PASS" 
-keypass "$KEY_PASS" 
-dname "CN=ZenithGuard, OU=Security, O=Zenith, L=Istanbul, C=TR"
fi
​- name: Build Signed Release APK
env:
BUILD_NUMBER: {{ github.run_number }}
RELEASE_VERSION_NAME: 1.0.{{ github.run_number }}
KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ZenithGuard123!' }}
KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zenithguard_key' }}
KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ZenithGuard123!' }}
run: |
./gradlew assembleRelease 
-PversionCode="$BUILD_NUMBER" 
-PversionName="$RELEASE_VERSION_NAME" 
--stacktrace
​- name: Verify APK Signature
run: |
APK_PATH="app/build/outputs/apk/release/app-release.apk"
​if [ ! -f "$APK_PATH" ]; then
echo "APK bulunamadı!"
exit 1
fi
​BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
​"$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
​echo "APK Signature Verification Complete!"
​- name: Organize Output Artifacts
run: |
mkdir -p output
​cp app/build/outputs/apk/release/app-release.apk 
"output/ZenithGuard-v1.0.${{ github.run_number }}-Signed.apk"
​- name: Upload Signed APK Artifact
uses: actions/upload-artifact@v4
with:
name: ZenithGuard-v1.0.{{ github.run_number }}-Signed-APK
path: output/ZenithGuard-v1.0.{{ github.run_number }}-Signed.apk
retention-days: 30
